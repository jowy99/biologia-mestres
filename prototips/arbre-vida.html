<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'arbre de la vida</title>
<meta name="description" content="Prototip: els cinc regnes clàssics comparats amb la classificació actual.">
<meta name="theme-color" content="#5763b6">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="arbre.css">
<script src="../assets/comu.js"></script>
</head>
<body>
<a class="skip" href="#main">Salta al contingut</a>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="../tema-08/" title="Tornar al tema 8">
      <span class="brand-mark">08</span>
      <span class="brand-text"><b>Els cinc regnes</b><small>← Tornar al tema</small></span>
    </a>
    <span class="spacer"></span>
    <button class="btn theme-toggle" type="button" aria-label="Canvia el tema"></button>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1">
  <div class="view-head"><h1>L'arbre de la vida</h1><p>Els mateixos organismes, ordenats de dues maneres. Canvia de model i mira on va a parar cada color.</p></div>
  <div class="arbre-tools">
    <div class="seg" id="modes" role="group" aria-label="Model de classificació">
      <button type="button" data-mode="classic" aria-pressed="true">5 regnes (clàssic)</button><button type="button" data-mode="actual" aria-pressed="false">Visió actual</button>
    </div>
    <ul class="llegenda" aria-label="Colors: regne clàssic">
      <li><i style="background:var(--k1)"></i>Moneres</li><li><i style="background:var(--k2)"></i>Protoctists</li><li><i style="background:var(--k3)"></i>Fongs</li><li><i style="background:var(--k4)"></i>Plantes</li><li><i style="background:var(--k5)"></i>Animals</li>
    </ul>
  </div>
  <p class="nota" id="nota" aria-live="polite"></p>
  <div class="card arbre-card"><svg id="arbre" role="group" aria-label="Arbre de classificació"></svg></div>
  <div class="card fitxa" id="fitxa" aria-live="polite"><p class="muted">Toca un grup o un organisme per veure'n la fitxa.</p></div>
</main>
<script src="arbre.js" defer></script>
</body>
</html>
