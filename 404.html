<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pàgina no trobada · Biologia per a mestres</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #fafafc; --surface: #ffffff; --ink: #1d1e29; --muted: #696b78; --line: #dddde3; --accent: #5763b6; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0f15; --surface: #171821; --ink: #ecedf3; --muted: #a3a5b5; --line: #2c2e3a; --accent: #8a99e3; --on-accent: #0e0f15; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 440px; padding: 32px 24px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .num { margin: 0; font-size: 3.4rem; font-weight: 800; line-height: 1; color: var(--accent); }
  h1 { margin: 12px 0 8px; font-size: 1.5rem; line-height: 1.2; }
  p { margin: 0 0 24px; color: var(--muted); }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="num" aria-hidden="true">404</p>
  <h1>Aquesta pàgina no existeix</h1>
  <p>Potser l'enllaç és antic o la pàgina s'ha retirat. Tot el contingut continua al menú de temes.</p>
  <a href="/">Torna a l'inici</a>
</main>
</body>
</html>
